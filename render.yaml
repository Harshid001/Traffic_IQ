services:
  - type: web
    name: trafficiq-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CHRONOS_DEVICE
        value: cpu
      - key: TRAFFIC_MODE
        value: DEMO
      - key: REQUIRE_API_KEY
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"

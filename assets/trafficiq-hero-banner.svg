<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1527"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    @keyframes dashMove {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.6); opacity: 0.3; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes carMove {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }
    @keyframes glowText {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.7)); }
    }

    .grid-bg { fill: url(#gridPattern); }
    .dash-line-fast {
      stroke-dasharray: 8, 6;
      animation: dashMove 2s linear infinite;
    }
    .dash-line-smart {
      stroke-dasharray: 6, 6;
      animation: dashMove 1.4s linear infinite;
    }
    .pulse-radar {
      transform-origin: 800px 170px;
      animation: radarSweep 8s linear infinite;
    }
    .floating-badge {
      animation: floatCard 4s ease-in-out infinite;
    }
    .hero-glow-title {
      animation: glowText 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="960" height="340" rx="16" class="grid-bg"/>
  <rect width="958" height="338" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Radar Ambient Backdrop in Right Section -->
  <g opacity="0.45">
    <circle cx="800" cy="170" r="120" stroke="#1E293B" stroke-width="1.5" fill="none"/>
    <circle cx="800" cy="170" r="85" stroke="#334155" stroke-width="1" fill="none" stroke-dasharray="4,4"/>
    <circle cx="800" cy="170" r="50" stroke="#38BDF8" stroke-width="1" fill="none" stroke-opacity="0.4"/>
    <circle cx="800" cy="170" r="16" fill="#38BDF8" fill-opacity="0.1"/>
    
    <!-- Sweep Cone -->
    <g class="pulse-radar">
      <path d="M 800 170 L 920 170 A 120 120 0 0 0 885 85 Z" fill="url(#radarGrad)"/>
    </g>
  </g>

  <!-- Animated Highway Route Vectors -->
  <g>
    <!-- Congested Traditional Route (Red/Orange) -->
    <path d="M 520 270 C 620 270, 660 210, 720 205 C 780 200, 810 240, 910 220" 
          stroke="#EF4444" stroke-width="3" fill="none" stroke-opacity="0.4"/>
    <path d="M 520 270 C 620 270, 660 210, 720 205 C 780 200, 810 240, 910 220" 
          stroke="#F87171" stroke-width="2.5" fill="none" class="dash-line-fast" stroke-opacity="0.7"/>

    <!-- Chronos-2 Predictive Optimal Route (Cyan/Emerald Smart Corridor) -->
    <path d="M 520 270 C 580 270, 610 130, 710 110 C 800 90, 840 130, 910 120" 
          stroke="#10B981" stroke-width="5" fill="none" filter="url(#softGlow)" stroke-opacity="0.6"/>
    <path d="M 520 270 C 580 270, 610 130, 710 110 C 800 90, 840 130, 910 120" 
          stroke="#38BDF8" stroke-width="3" fill="none" class="dash-line-smart"/>

    <!-- Waypoint Nodes -->
    <circle cx="520" cy="270" r="6" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="520" cy="270" r="3" fill="#FFFFFF"/>
    
    <circle cx="710" cy="110" r="5" fill="#10B981" filter="url(#glow)"/>
    <circle cx="710" cy="110" r="2.5" fill="#FFFFFF"/>

    <circle cx="910" cy="120" r="7" fill="#818CF8" filter="url(#glow)"/>
    <circle cx="910" cy="120" r="3.5" fill="#FFFFFF"/>

    <!-- Dynamic Alert Marker on Congested Path -->
    <g transform="translate(720, 205)">
      <circle cx="0" cy="0" r="10" fill="#EF4444" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="5" fill="#EF4444"/>
      <text x="0" y="3" fill="#FFFFFF" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">!</text>
    </g>
  </g>

  <!-- Left Hero Content & Branding -->
  <g transform="translate(48, 52)">
    <!-- Eyebrow Badge -->
    <rect width="260" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="17" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      ENTERPRISE TRAFFIC ENGINE v2.0
    </text>

    <!-- Main Title -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" fill="url(#primaryGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8" class="hero-glow-title">
        TrafficIQ
      </text>
      <text x="180" y="-3" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" letter-spacing="-0.5">
        Navigation Engine
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="90" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="400">
      Amazon Chronos-2 Probabilistic Forecasting • 3-Layer Zero-Hallucination Guardrails
    </text>
    <text x="0" y="112" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400">
      Multi-Objective Scoring (⚡ Fastest vs ⭐ Best) • Native Mobile HUD • Live AI Copilot
    </text>

    <!-- Interactive Metric Badges / Chips -->
    <g transform="translate(0, 142)">
      <!-- Metric 1: MAE -->
      <g>
        <rect width="125" height="58" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">47.3%</text>
        <text x="12" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">MAE Reduction</text>
      </g>

      <!-- Metric 2: Quantile Bounds -->
      <g transform="translate(135, 0)">
        <rect width="130" height="58" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">P₁₀ / P₅₀ / P₉₀</text>
        <text x="12" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Quantile Forecasts</text>
      </g>

      <!-- Metric 3: Zero-Hallucination -->
      <g transform="translate(275, 0)">
        <rect width="135" height="58" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#C084FC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">3-Layer</text>
        <text x="12" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Deterministic Safety</text>
      </g>

      <!-- Metric 4: Latency -->
      <g transform="translate(420, 0)">
        <rect width="115" height="58" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="24" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">&lt; 1.2s</text>
        <text x="12" y="44" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500">Realtime Routing</text>
      </g>
    </g>
  </g>

  <!-- Right Floating Live Indicator Card -->
  <g transform="translate(685, 34)" class="floating-badge">
    <rect width="225" height="96" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.2" filter="url(#softGlow)" stroke-opacity="0.8"/>
    
    <!-- Header of card -->
    <circle cx="20" cy="22" r="4" fill="#10B981"/>
    <text x="32" y="26" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">LIVE ROUTE COMPARISON</text>
    
    <!-- Fastest vs Best comparison inside card -->
    <g transform="translate(16, 40)">
      <text x="0" y="14" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">⚡ Shortest Route:</text>
      <text x="105" y="14" fill="#F87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">32m (Severe Cong.)</text>

      <text x="0" y="34" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">⭐ TrafficIQ Best:</text>
      <text x="105" y="34" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">26m (94% Reliable)</text>
    </g>
  </g>
</svg>
